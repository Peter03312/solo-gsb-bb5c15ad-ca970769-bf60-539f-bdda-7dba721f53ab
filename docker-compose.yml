services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radio
      POSTGRES_PASSWORD: radio
      POSTGRES_DB: radio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio -d radio"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://radio:radio@db:5432/radio
      # 默认保护带宽（MHz）；申请可逐笔覆盖
      GUARD_BAND_MHZ: "0.25"
    ports:
      - "8000:8000"

volumes:
  pgdata:
